<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="100%">
  <rect width="760" height="520" rx="48" fill="#FFFFFF" />
  <!-- Left Circuit Traces to S (Navy #082142) -->
  <g stroke="#082142" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 110 145 L 170 145 L 220 182 L 250 182" fill="none" />
    <path d="M 80 230 L 220 230" fill="none" />
    <path d="M 110 315 L 170 315 L 220 278 L 240 278" fill="none" />
  </g>
  <circle cx="110" cy="145" r="15" fill="#082142" />
  <circle cx="80" cy="230" r="15" fill="#082142" />
  <circle cx="110" cy="315" r="15" fill="#082142" />

  <!-- Big Bold Letter 'S' (Navy #082142) -->
  <path
    d="M 250 120
       C 250 75 290 45 355 45
       C 395 45 425 60 445 85
       L 390 125
       C 380 110 365 100 350 100
       C 320 100 310 115 310 130
       C 310 150 330 165 375 180
       C 430 200 465 235 465 285
       C 465 345 415 385 345 385
       C 295 385 250 360 225 320
       L 280 280
       C 295 305 315 325 345 325
       C 375 325 400 305 400 285
       C 400 260 380 245 340 230
       C 280 210 250 175 250 120 Z"
    fill="#082142"
  />

  <!-- Big Bold Letter 'P' (Teal #008080) -->
  <path
    d="M 365 45
       L 515 45
       C 580 45 625 85 625 155
       C 625 225 580 265 515 265
       L 430 265
       L 430 385
       L 365 385
       Z
       M 430 105
       L 430 205
       L 505 205
       C 540 205 560 185 560 155
       C 560 125 540 105 505 105
       Z"
    fill="#008080"
  />

  <!-- Right Circuit Traces from P (Teal #008080) -->
  <g stroke="#008080" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 610 158 L 645 125 L 700 125" fill="none" />
    <path d="M 625 220 L 720 220" fill="none" />
    <path d="M 575 265 L 620 305 L 700 305" fill="none" />
  </g>
  <circle cx="700" cy="125" r="15" fill="#008080" />
  <circle cx="720" cy="220" r="15" fill="#008080" />
  <circle cx="700" cy="305" r="15" fill="#008080" />

  <!-- Center Microchip Package at bottom joint between S and P -->
  <g transform="translate(380, 370)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" />

    <!-- 8 Pins -->
    <rect x="-14" y="-38" width="6" height="13" rx="2" fill="#082142" />
    <rect x="8" y="-38" width="6" height="13" rx="2" fill="#082142" />
    <rect x="-14" y="25" width="6" height="13" rx="2" fill="#082142" />
    <rect x="8" y="25" width="6" height="13" rx="2" fill="#082142" />
    <rect x="-38" y="-14" width="13" height="6" rx="2" fill="#082142" />
    <rect x="-38" y="8" width="13" height="6" rx="2" fill="#082142" />
    <rect x="25" y="-14" width="13" height="6" rx="2" fill="#082142" />
    <rect x="25" y="8" width="13" height="6" rx="2" fill="#082142" />

    <rect x="-27" y="-27" width="54" height="54" rx="8" fill="#082142" />
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#FFFFFF" />
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#082142" />
  </g>
</svg>
